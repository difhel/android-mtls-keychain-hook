# Alias of the client key pair in the Android KeyChain ("VPN & app user certificate").
keychain.alias=mtls-phone
# Whitelist: only these apps get the injected client certificate, and only these
# get KeyChain access to the alias without the per-app selection dialog.
# They must also be in the module's Vector/LSPosed scope (build.sh prints the command).
packages=com.android.chrome,io.github.difhel.mtlsprobe
# Hosts that may receive the certificate: exact names, or "*.example.com" for any subdomain.
# Checked together with the CA below: both must match.
hosts=mtls.example.com
# Offer the certificate only when the server's CertificateRequest names this CA
# (nginx ssl_client_certificate). Path to the CA cert, relative to this file.
ca.cert=../pki/ca.crt
# Key algorithm of the client key ("EC" or "RSA"), as TLS key types name it.
key.type=EC
# Servers that send an empty CA list accept any CA; do not offer the key to them by default.
offer.on.empty.issuers=false
